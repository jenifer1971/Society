services:

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────────
  # Stores the knowledge graph (nodes, edges) and agent activity logs.
  # pgvector/pgvector ships with the vector extension pre-installed — no extra
  # setup needed.  All data stays inside the container volume; nothing is sent
  # to any external service.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: society-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: society
      POSTGRES_PASSWORD: society
      POSTGRES_DB: society
    volumes:
      - society_postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U society"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MiroFish application ───────────────────────────────────────────────────
  mirofish:
    build: .
    container_name: mirofish
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Point app at the local postgres container — overrides anything in .env
      - POSTGRES_DSN=postgresql://society:society@postgres:5432/society
    ports:
      - "3000:3000"
      - "5001:5001"
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  society_postgres_data:
