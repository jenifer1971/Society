services:

  # ── Self-hosted Zep memory store ──────────────────────────────────────────
  # Agent memories never leave your infrastructure.
  # Zep uses ZEP_LLM_API_KEY + ZEP_LLM_ENDPOINT for its internal embeddings.
  # Point these at whichever cloud provider the enterprise already subscribes to.
  # e.g. Google: endpoint = https://generativelanguage.googleapis.com/v1beta/openai/
  #      Azure:  endpoint = https://<resource>.openai.azure.com/openai/deployments/<deploy>/
  #      OpenAI: leave endpoint blank (default)
  # Local embedding server — Zep points here instead of OpenAI
  # nomic-embed-text is a small, fast embedding model (~274MB)
  # No data leaves the enterprise — fully on-prem
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Pull the embedding model on first start
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull nomic-embed-text &&
             wait"

  zep:
    image: ghcr.io/getzep/zep:0.27.2
    container_name: zep
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./zep-config.yaml:/app/config.yaml
    environment:
      - ZEP_OPENAI_API_KEY=ollama
    depends_on:
      zep-db:
        condition: service_healthy
      ollama:
        condition: service_started

  zep-db:
    image: postgres:16-alpine
    container_name: zep-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zep
      POSTGRES_PASSWORD: zep
      POSTGRES_DB: zep
    volumes:
      - zep_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zep"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MiroFish application ───────────────────────────────────────────────────
  mirofish:
    build: .
    container_name: mirofish
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Point Zep at the local container — overrides anything in .env
      - ZEP_BASE_URL=http://zep:8000
    ports:
      - "3000:3000"
      - "5001:5001"
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      - zep

volumes:
  zep_postgres_data:
  ollama_data:
